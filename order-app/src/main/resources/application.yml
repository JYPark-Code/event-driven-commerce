# order-service. DB는 서비스 소유 스키마(tps_order, 3b-2) — 정산은 이 스키마를 직접 읽지 못하고
# 내부 집계 API(3b-1)로만 접근한다.
spring:
  application:
    name: order-service

  datasource:
    url: jdbc:mysql://localhost:3307/tps_order?serverTimezone=UTC&characterEncoding=UTF-8&rewriteBatchedStatements=true
    # 기본값은 로컬 docker-compose 데모 계정. 운영은 환경변수 주입 — 시크릿 외부화(decisions.md 23번)
    username: ${DB_USERNAME:tps}
    password: ${DB_PASSWORD:tps1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20

  jpa:
    hibernate:
      ddl-auto: validate  # 스키마는 Flyway 소유 (decisions.md 25번)
    open-in-view: false
    show-sql: false

  flyway:
    baseline-on-migrate: true  # 기존 데모 DB 호환 — 마이그레이션은 IF NOT EXISTS로 멱등

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      # 조합 하네스(app, group=tps1000)와 그룹 분리 — 공유하면 경쟁 소비로 주문이 두 DB에 쪼개진다.
      # 새 그룹 + earliest = 첫 기동 시 토픽 재생으로 과거 비동기 주문이 tps_order에 적재됨(멱등 INSERT IGNORE).
      group-id: order-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.jypark.tps1000.*
        spring.json.value.default.type: com.jypark.tps1000.order.event.OrderCreatedEvent
        spring.json.use.type.headers: false

internal:
  # /internal/** 검증용 공유 시크릿 (InternalApiTokenFilter) — backoffice-app과 같은 값이어야 정산이 동작.
  api-token: ${INTERNAL_API_TOKEN:tps1000-internal-demo-token}

server:
  port: 8082

management:
  server:
    port: 9082  # 관리 포트 분리 (decisions.md 25번) — 서비스 포트에선 /actuator 비노출
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
