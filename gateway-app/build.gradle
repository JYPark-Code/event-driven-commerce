// API 게이트웨이 (:8080, MSA 3c) — 클라이언트 단일 진입점. 모놀리스와 같은 포트라
// 클라이언트 입장에선 인터페이스가 바뀌지 않는다 (조합 앱과 동시 기동은 불가 — 같은 포트).
apply plugin: 'org.springframework.boot'

dependencyManagement {
	imports {
		// Boot 3.5.x 호환 트레인(2025.0.x — 2025.1.x는 Boot 4용). 게이트웨이 모듈에만 적용.
		mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2025.0.2'
	}
}

dependencies {
	implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'
	// RedisRateLimiter(로그인 브루트포스 방어, decisions.md 24번) — WebFlux 게이트웨이라 reactive 클라이언트
	implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
}
