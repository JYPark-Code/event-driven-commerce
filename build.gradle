// MSA 1단계: 도메인 패키지 경계를 Gradle 모듈 경계로 승격 (docs/decisions.md 17번).
// 루트에는 소스가 없다 — 공통 빌드 설정만 정의하고, 부트 앱은 :app 모듈이다.
plugins {
	id 'org.springframework.boot' version '3.5.14' apply false
	id 'io.spring.dependency-management' version '1.1.7' apply false
}

subprojects {
	apply plugin: 'java-library'
	apply plugin: 'io.spring.dependency-management'

	group = 'com.jypark'
	version = '0.0.1-SNAPSHOT'

	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(17)
		}
	}

	repositories {
		mavenCentral()
	}

	dependencyManagement {
		imports {
			mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
		}
	}

	dependencies {
		compileOnly 'org.projectlombok:lombok'
		annotationProcessor 'org.projectlombok:lombok'
		testCompileOnly 'org.projectlombok:lombok'
		testAnnotationProcessor 'org.projectlombok:lombok'
	}

	// 한글 주석이 있는 소스를 어느 OS에서 빌드해도 동일하게 — Windows 기본(CP949) 의존 제거.
	// -parameters: @PathVariable/@RequestParam 이름 해석에 필요 — 단일 모듈에선 부트 플러그인이
	// 자동으로 넣어줬지만, java-library만 쓰는 도메인 모듈엔 직접 명시해야 한다.
	tasks.withType(JavaCompile).configureEach {
		options.encoding = 'UTF-8'
		options.compilerArgs << '-parameters'
	}

	tasks.named('test') {
		useJUnitPlatform()
	}
}
