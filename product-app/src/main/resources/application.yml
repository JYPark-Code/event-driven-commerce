# product-service. DB는 서비스 소유 스키마(tps_product, 3b-2) — MySQL 인스턴스·Kafka·Redis는
# 로컬 데모라 공유 (운영이면 인스턴스도 분리할 지점). 값들은 조합 앱(app/)과 동일 기준.
spring:
  application:
    name: product-service

  datasource:
    url: jdbc:mysql://localhost:3307/tps_product?serverTimezone=UTC&characterEncoding=UTF-8&rewriteBatchedStatements=true
    username: tps
    password: tps1234
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

  data:
    redis:
      host: localhost
      port: 16379

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
