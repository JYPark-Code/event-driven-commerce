# product-service. DB는 서비스 소유 스키마(tps_product, 3b-2) — MySQL 인스턴스·Kafka·Redis는
# 로컬 데모라 공유 (운영이면 인스턴스도 분리할 지점). 값들은 조합 앱(app/)과 동일 기준.
spring:
  application:
    name: product-service

  datasource:
    url: jdbc:mysql://localhost:3307/tps_product?serverTimezone=UTC&characterEncoding=UTF-8&rewriteBatchedStatements=true
    # 기본값은 로컬 docker-compose 데모 계정. 운영은 환경변수 주입 — 시크릿 외부화(decisions.md 23번)
    username: ${DB_USERNAME:tps}
    password: ${DB_PASSWORD:tps1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20

  jpa:
    hibernate:
      ddl-auto: validate  # 스키마는 Flyway 소유 (decisions.md 25번)
    open-in-view: false
    show-sql: false

  flyway:
    baseline-on-migrate: true  # 기존 데모 DB 호환 — 마이그레이션은 IF NOT EXISTS로 멱등

  data:
    redis:
      host: localhost
      port: 16379

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8081

management:
  server:
    port: 9081  # 관리 포트 분리 (decisions.md 25번) — 서비스 포트에선 /actuator 비노출
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
