# backoffice-service. DB는 서비스 소유 스키마(tps_backoffice, 3b-2) — users·settlements·
# product_replica·BATCH_* 메타가 여기 산다. 타 도메인 데이터는 이벤트 복제(상품)와
# 내부 API(주문 집계)로만 접근 — 크로스 스키마 SQL 없음.
spring:
  application:
    name: backoffice-service

  datasource:
    url: jdbc:mysql://localhost:3307/tps_backoffice?serverTimezone=UTC&characterEncoding=UTF-8&rewriteBatchedStatements=true
    username: tps
    password: tps1234
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      # 복제 리스너는 전용 팩토리(String 역직렬화)를 쓰고 groupId도 어노테이션에서 지정한다.
      # 여기는 부트스트랩 주소와 오프셋 정책만 — earliest라 새로 배포돼도 토픽 처음부터 복제.
      group-id: tps1000-backoffice
      auto-offset-reset: earliest

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

jwt:
  # 데모용 고정 키. 발급자=검증자(이 서비스)라 분리 후에도 HS256으로 충분 — RS256 전환 시점은 docs/msa-architecture.md 4번.
  secret: tps1000-demo-jwt-secret-key-do-not-use-in-production-0123456789
  expiry-seconds: 3600

backoffice:
  admin:
    username: admin
    password: admin1234!
  # 복제 컨슈머 그룹 — 배포 단위(DB)마다 분리해야 경쟁 소비가 없다 (ProductReplicaConsumer 주석).
  # 그룹 이름 변경 = 토픽 재생으로 복제본 재구축.
  replica-consumer-group: backoffice-product-replica
  order-service:
    # 정산 리더의 월별 집계 API 주소 (MSA 3b) — order-app
    url: http://localhost:8082

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
