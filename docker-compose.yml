# 로컬 개발/부하테스트용 인프라. MySQL · Redis · Kafka(KRaft, 단일 노드).
# why KRaft: Zookeeper 제거로 컨테이너 1개로 Kafka 운영 → 데모 환경 단순화. (docs/decisions.md 참고)
# 비밀번호류는 .env로 덮어쓸 수 있다(.env.example 참고, decisions.md 23번) — 없으면 로컬 데모 기본값.
services:
  mysql:
    image: mysql:8.0
    container_name: tps-mysql
    ports:
      - "3307:3306"   # 호스트 3306은 로컬 mysqld가 점유 → 충돌 회피 (docs/decisions.md)
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root1234}
      MYSQL_DATABASE: tps1000
      MYSQL_USER: ${MYSQL_USER:-tps}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tps1234}   # 앱 쪽 DB_PASSWORD와 같은 값이어야 한다
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      # CMD-SHELL + $$: 컨테이너 안의 MYSQL_ROOT_PASSWORD 환경변수를 쓴다 — 비밀번호를 바꿔도 헬스체크가 깨지지 않게
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - mysql-data:/var/lib/mysql
      # MSA 서비스별 스키마(tps_product·tps_order·tps_backoffice) 생성 — 새 볼륨 초기화 시에만 실행됨.
      # 기존 볼륨이면 스크립트 상단의 docker exec 명령으로 1회 수동 적용.
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    container_name: tps-redis
    ports:
      - "16379:6379"  # 6379는 Windows Hyper-V 예약 포트 범위(6290-6389)에 걸려 바인딩 불가 → 회피 (docs/decisions.md)
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data

  kafka:
    image: apache/kafka:3.8.1
    container_name: tps-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── 모니터링 (Prometheus pull → Grafana 시각화) ──
  # 앱은 호스트에서 돌므로 host.docker.internal로 /actuator/prometheus를 스크레이프한다.
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: tps-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.1.0
    container_name: tps-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin1234}
    volumes:
      # 데이터소스·대시보드를 코드로 프로비저닝 — 컨테이너를 지워도 클릭 설정 없이 재현된다
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  mysql-data:
  redis-data:
