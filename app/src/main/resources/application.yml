spring:
  application:
    name: tps1000

  datasource:
    url: jdbc:mysql://localhost:3307/tps1000?serverTimezone=UTC&characterEncoding=UTF-8&rewriteBatchedStatements=true
    # 기본값은 로컬 docker-compose 데모 계정. 운영은 환경변수 주입 — 시크릿 외부화(decisions.md 23번)
    username: ${DB_USERNAME:tps}
    password: ${DB_PASSWORD:tps1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 1000 TPS 목표 대비 커넥션 풀 튜닝은 부하테스트 단계에서 측정 기반으로 조정 (docs/benchmarks.md)
      maximum-pool-size: 20

  jpa:
    hibernate:
      ddl-auto: update          # 데모 단계: 엔티티 기반 자동 스키마. 운영이면 Flyway로 전환할 지점.
    open-in-view: false         # OSIV 끔 — 영속성 컨텍스트 수명을 트랜잭션으로 한정 (커넥션 점유 시간 단축)
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 16379  # 6379는 Windows 예약 포트 범위(6290-6389)에 걸림 → docker-compose에서 16379로 매핑

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      # acks/멱등 프로듀서는 Kafka 3.x 기본값(acks=all, enable.idempotence=true) 유지.
      # linger.ms 등 처리량 튜닝은 부하 측정 후 수치 근거로 조정 (docs/benchmarks.md)
    consumer:
      group-id: tps1000
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # 역직렬화 실패가 무한 재소비(poison pill)로 이어지지 않게 ErrorHandlingDeserializer로 감쌈
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.jypark.tps1000.*
        spring.json.value.default.type: com.jypark.tps1000.order.event.OrderCreatedEvent
        spring.json.use.type.headers: false

  batch:
    job:
      enabled: false            # 부팅 시 잡 자동 실행 금지 (수동/스케줄 트리거)
    jdbc:
      initialize-schema: always # Spring Batch 메타테이블 자동 생성

jwt:
  # 환경변수 우선, 없으면 로컬 데모 키 (HS256은 256비트 이상 필요). 운영은 JWT_SECRET 필수 주입 — decisions.md 23번.
  secret: ${JWT_SECRET:tps1000-demo-jwt-secret-key-do-not-use-in-production-0123456789}
  expiry-seconds: 3600

internal:
  # 서비스 간 내부 API(/internal/**) 공유 시크릿 (InternalApiTokenFilter, decisions.md 23번).
  # 조합 앱은 정산 리더가 자기 자신을 HTTP로 호출하므로 발신·검증 양쪽에 같은 값이 쓰인다.
  api-token: ${INTERNAL_API_TOKEN:tps1000-internal-demo-token}

backoffice:
  admin:
    # ADMIN 시드 계정 (AdminAccountInitializer). 가입 API로는 USER만 생성 가능.
    username: admin
    password: ${BACKOFFICE_ADMIN_PASSWORD:admin1234!}
  order-service:
    # 정산 리더의 월별 집계 API 주소 (MSA 3b). 조합 앱은 order 도메인이 같은 프로세스라 자기 자신.
    url: http://localhost:8080
  # 조합 하네스 전용 복제 컨슈머 그룹 — 분리 앱(backoffice-app)과 공유하면 경쟁 소비로
  # 한쪽 복제본에 구멍이 난다 (ProductReplicaConsumer 주석, decisions.md 21번).
  replica-consumer-group: tps1000-replica-harness

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      # Grafana에서 histogram_quantile()로 p95/p99를 계산하기 위한 버킷 노출.
      # 버킷 시계열 추가 비용(~70개/uri)이 있으나 단일 앱 데모 규모에선 무시 가능 (docs/decisions.md 16번)
      percentiles-histogram:
        http.server.requests: true
